name: Daily AeroNewsFRA research

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spreadsheet reader
        run: python -m pip install openpyxl
      - name: Search source feeds and stage candidates
        run: python scripts/daily_research.py
      - name: Commit review candidates
        run: |
          git config user.name "AeroNewsFRA Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news.xlsx
          git diff --cached --quiet || git commit -m "Stage daily FRA news candidates"
          git push
